name: Check and build PR

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    # The tarball is only worth making for a PR; a branch push just gets checked
    if: github.event_name == 'pull_request'
    needs: [check]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm base-devel git rust
      - uses: actions/checkout@v5
      - name: Build binary
        run: cargo build --release
      - name: Create tarball
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH_NAME="x86_64"
          elif [ "$ARCH" = "aarch64" ]; then
            ARCH_NAME="aarch64"
          fi
          mkdir -p keymux-linux-${ARCH_NAME}
          mv target/release/keymux keymux-linux-${ARCH_NAME}/
          cp keymux.service keymux-niri.service keymux-linux-${ARCH_NAME}/ 2>/dev/null || true
          cp README.md LICENSE config.example.ron keymux-linux-${ARCH_NAME}/ 2>/dev/null || true
          tar -czf keymux-linux-${ARCH_NAME}.tar.gz -C keymux-linux-${ARCH_NAME} .
      - name: Generate checksum
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH_NAME="x86_64"
          elif [ "$ARCH" = "aarch64" ]; then
            ARCH_NAME="aarch64"
          fi
          sha256sum keymux-linux-${ARCH_NAME}.tar.gz > keymux-linux-${ARCH_NAME}.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: keymux-linux
          path: |
            keymux-linux-*.tar.gz
            keymux-linux-*.sha256
