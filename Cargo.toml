[package]
name = "keymux"
version = "1.13.0"
edition = "2021"

[lib]
name = "keymux"
path = "src/lib.rs"

[[bin]]
name = "keymux"
path = "src/main.rs"

[dependencies]
evdev = "0.12"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ron = "0.8"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = "0.3"
dialoguer = "0.11"
console = "0.15"
dirs = "5.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
bincode = "1.3"
rustc-hash = "2"
libc = "0.2"
smallvec = "1.13"
colored = "2.1"
notify = "6.1"
tokio = { version = "1.41", features = ["full"] }
crossbeam-channel = "0.5"
crossterm = "0.28"
sha2 = "0.10"

# `keymux overlay`: on-screen steno keyboard and tape (Wayland layer-shell)
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"], optional = true }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"], optional = true }
ab_glyph = { version = "0.2", optional = true }

# `keymux textbox`: reads the text around the cursor of the focused text box (Wayland input method)
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "unstable"], optional = true }
wayland-protocols-misc = { version = "0.3", features = ["client"], optional = true }

[dev-dependencies]
# A stand-in compositor, so the text box listener can be tested without a real one
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["server"] }

[features]
default = ["overlay", "textbox"]
overlay = ["dep:smithay-client-toolkit", "dep:tiny-skia", "dep:ab_glyph"]
textbox = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-misc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
incremental = false

[profile.release.build-override]
opt-level = 3

[profile.release.package."*"]
opt-level = 3

# Profile-guided optimization setup (use after profiling)
# [profile.release]
# opt-level = 3
# lto = "fat"
# codegen-units = 1
# panic = "abort"
# strip = true
# overflow-checks = false
#
# Run with:
# 1. RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" cargo build --release
# 2. ./target/release/keymux  # Use normally to generate profile
# 3. llvm-profdata merge -o /tmp/pgo-data/merged.profdata /tmp/pgo-data
# 4. RUSTFLAGS="-Cprofile-use=/tmp/pgo-data/merged.profdata" cargo build --release
